# Parametros de baja latencia BLE entre mitades (reduce el retraso de sincronizacion RGB)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Buffers de comunicacion BLE
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# Configuracion ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# Potencia y enlace Bluetooth
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_KEYBOARD_NAME="XI-MK1_2"

# Configuracion de iluminacion RGB
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_LED_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# 0 = Efecto solido estatico (apaga la animacion arcoiris automatica)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0

# Color base al encender: Cyan claro (Hue: 180, Saturacion: 60, Brillo: 40)
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=180
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=60
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40

# Apagar LEDs cuando el teclado entra en suspension
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Configuracion de encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse y Trackball
CONFIG_ZMK_POINTING=y

# Enable 32kHz crystal
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y
